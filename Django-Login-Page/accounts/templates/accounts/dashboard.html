<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #080a10;
            color: white;
            font-family: Tahoma, sans-serif;
        }

        .card {
            text-align: center;
            padding: 35px;
            border: 1px solid #ffffff22;
            border-radius: 20px;
            background: #171b27;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 9px;
            background: #ffcf72;
            color: #21170a;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>خوش اومدی {{ request.user.username }} ✨</h1>
        <p>با موفقیت وارد حساب کاربریت شدی.</p>
        <a href="{% url 'accounts:login' %}">بازگشت به صفحه ورود</a>
    </div>
</body>
</html>
